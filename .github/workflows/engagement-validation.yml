name: Engagement PR full validation
'on':
  push:
    branches:
    - validation/1259-complete-ci
permissions:
  contents: read
concurrency:
  group: engagement-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 4e9e2ee1c08648e7d39c4d8237ef0237673ada47
        persist-credentials: false
    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --group dev
    - name: Run pre-commit hooks
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd
    - name: Optimize uv cache for CI
      run: uv cache prune --ci
  linux:
    name: Linux tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: 'false'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 4e9e2ee1c08648e7d39c4d8237ef0237673ada47
        persist-credentials: false
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        enable-cache: true
    - run: uv sync --group dev
    - name: Resolve the patchright version
      id: patchright
      run: 'version=$(uv run python -c ''from importlib.metadata import version; print(version("patchright"))'')

        echo "version=$version" >> "$GITHUB_OUTPUT"

        '
    - name: Restore the browser
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.patchright.outputs.version }}
    - name: Install the browser
      run: uv run patchright install --with-deps chromium --no-shell
    - name: Start a display
      run: "Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &\nfor _ in $(seq 1 100); do\n  if [ -S /tmp/.X11-unix/X99\
        \ ]; then exit 0; fi\n  sleep 0.1\ndone\necho \"Xvfb never created /tmp/.X11-unix/X99:\" >&2\ncat /tmp/xvfb.log >&2\n\
        exit 1\n"
    - name: Measure retained leader pidfd group signaling
      run: uv run pytest -v -s -o faulthandler_timeout=120 tests/test_pidfd_group_signal.py::test_retained_leader_pidfd_signals_its_group_after_reaping
    - name: Run tests
      env:
        DISPLAY: :99
      run: uv run pytest --cov --cov-report=term-missing -n auto --dist loadgroup -v -s --junitxml=validation-junit.xml --cov-report=xml:validation-coverage.xml
    - name: Keep the differential evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: differential-evidence-ubuntu-latest
        path: ${{ runner.temp }}/differential-evidence
        if-no-files-found: warn
        retention-days: 14
    - run: uv cache prune --ci
    - name: Keep test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: validation-linux-results
        path: validation-*.xml
        if-no-files-found: warn
  windows-daemon:
    name: Windows daemon (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: 'false'
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - 3.12.4
        - '3.13'
        - '3.14'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 4e9e2ee1c08648e7d39c4d8237ef0237673ada47
        persist-credentials: false
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - run: uv sync --group dev
    - name: Arm a crash dump for
      shell: pwsh
      run: '$folder = Join-Path $env:RUNNER_TEMP ''crash-dumps''

        New-Item -ItemType Directory -Force -Path $folder | Out-Null

        $key = ''HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps''

        New-Item -Path $key -Force | Out-Null

        Set-ItemProperty -Path $key -Name DumpFolder -Value $folder -Type ExpandString

        Set-ItemProperty -Path $key -Name DumpCount -Value 16 -Type DWord

        Set-ItemProperty -Path $key -Name DumpType -Value 1 -Type DWord

        '
    - name: Run daemon protocol and containment tests
      run: uv run pytest tests/test_daemon_election.py::TestAtomicStartupCommit tests/test_daemon_election.py::TestElectionSettlement
        tests/test_daemon_election.py::TestOwnerBootstrapOrdering tests/test_daemon_election.py::TestPublishingLast tests/test_daemon_election.py::TestRealOwner::test_an_owner_is_started_and_answers
        tests/test_daemon_election.py::TestRealOwner::test_a_crashed_owner_is_replaced tests/test_daemon_election.py::TestRealOwner::test_many_clients_starting_at_once_elect_exactly_one_owner
        tests/test_daemon_election.py::TestRealOwner::test_launch_barrier_timeout_exits_without_electing tests/test_daemon_election.py::TestRealOwner::test_launch_barrier_failure_collects_started_frontends
        tests/test_daemon_election.py::TestAForwardedCallThroughTheRealOwner tests/test_daemon_proxy.py::TestAnOwnerProcessKilledMidCall
        tests/test_bootstrap.py::TestInstallerSupervisorLaunch::test_real_cpython_wait_unregister_contract tests/test_daemon_descriptor.py::TestPreparedCommit
        tests/test_daemon_descriptor.py::TestStateLocation tests/test_daemon_lock.py tests/test_installer_supervisor.py tests/test_installer_worker.py
        tests/test_process_tree.py tests/test_daemon_regression_witnesses.py tests/test_windows_guardian_probe.py tests/test_private_state.py
        tests/test_storage_class.py
    - name: Upload the crash dump
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: crash-dumps-${{ matrix.python-version }}
        path: ${{ runner.temp }}/crash-dumps
        if-no-files-found: ignore
        retention-days: 14
    - run: uv cache prune --ci
  platform-behaviour:
    name: Platform behaviour (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      FASTMCP_MCP_CAMELCASE_COMPAT: 'false'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          browsers: ~/Library/Caches/ms-playwright
        - os: windows-latest
          browsers: ~\AppData\Local\ms-playwright
        - os: ubuntu-24.04-arm
          browsers: ~/.cache/ms-playwright
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 4e9e2ee1c08648e7d39c4d8237ef0237673ada47
        persist-credentials: false
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      with:
        enable-cache: true
    - run: uv sync --group dev
    - name: Run platform behaviour tests
      run: uv run pytest -v -o faulthandler_timeout=120 tests/test_profile_lease.py tests/test_profile_lease_integration.py
        tests/test_private_state.py tests/test_session_state.py::test_the_native_machine_api_answers_on_windows tests/test_daemon_lock.py
        tests/test_process_tree.py tests/test_daemon_regression_witnesses.py tests/test_greenlet_runtime.py tests/test_storage_class.py
        tests/differential/test_watcher.py tests/differential/test_host_stub.py tests/differential/test_preservation_gate.py
        tests/differential/test_baseline.py tests/differential/test_signals.py tests/differential/test_failed_job_query.py
    - name: Resolve the patchright version
      id: patchright
      shell: bash
      run: 'version=$(uv run python -c ''from importlib.metadata import version; print(version("patchright"))'')

        echo "version=$version" >> "$GITHUB_OUTPUT"

        '
    - name: Restore the browser
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ matrix.browsers }}
        key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.patchright.outputs.version }}
    - name: Install the browser
      run: uv run patchright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium --no-shell
    - name: Start a display
      if: runner.os == 'Linux'
      run: "Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &\nfor _ in $(seq 1 100); do\n  if [ -S /tmp/.X11-unix/X99\
        \ ]; then exit 0; fi\n  sleep 0.1\ndone\necho \"Xvfb never created /tmp/.X11-unix/X99:\" >&2\ncat /tmp/xvfb.log >&2\n\
        exit 1\n"
    - name: Run the browser containment test
      run: uv run pytest tests/test_browser_containment.py
    - name: Run the Windows browser launch evidence
      if: runner.os == 'Windows'
      env:
        UV_PYTHON: '3.13'
      run: uv run pytest -v -s -o faulthandler_timeout=120 tests/test_windows_browser_launch_evidence.py
    - name: Run the identity gate
      env:
        DISPLAY: ${{ runner.os == 'Linux' && ':99' || '' }}
      run: uv run pytest tests/test_browser_identity.py
    - name: Keep the differential evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: differential-evidence-${{ matrix.os }}
        path: ${{ runner.temp }}/differential-evidence
        if-no-files-found: warn
        retention-days: 14
    - run: uv cache prune --ci
